<svg width="1280" height="560" viewBox="0 0 1280 560" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1280" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071225"/>
      <stop offset="0.52" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="100" y1="40" x2="650" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="redButton" x1="925" y1="441" x2="1175" y2="493" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EF4444"/>
      <stop offset="1" stop-color="#B91C1C"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" stroke="#334155" stroke-opacity="0.22"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18" result="blur"/>
      <feOffset in="blur" dy="16" result="offsetBlur"/>
      <feFlood flood-color="#020617" flood-opacity="0.55" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="38"/>
    </filter>
  </defs>

  <rect width="1280" height="560" rx="32" fill="url(#background)"/>
  <rect x="1" y="1" width="1278" height="558" rx="31" stroke="#334155" stroke-width="2"/>
  <rect width="1280" height="560" rx="32" fill="url(#grid)"/>

  <circle cx="153" cy="55" r="160" fill="#2563EB" fill-opacity="0.16" filter="url(#glow)"/>
  <circle cx="1195" cy="510" r="150" fill="#22C55E" fill-opacity="0.08" filter="url(#glow)"/>

  <g transform="translate(72 70)">
    <rect width="68" height="68" rx="18" fill="#0B2C68" stroke="#38BDF8" stroke-width="2"/>
    <circle cx="34" cy="34" r="19" stroke="#E2E8F0" stroke-width="4"/>
    <circle cx="34" cy="34" r="5" fill="#E2E8F0"/>
