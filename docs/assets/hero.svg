    <path d="M624 299L628 303L635 295" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <g font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#E2E8F0">
      <text x="652" y="305">Disk 1</text>
      <text x="720" y="305">Seagate HDD</text>
