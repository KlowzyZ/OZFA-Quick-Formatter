  <text x="72" y="182" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="1">OZFA QUICK</text>
  <text x="72" y="239" fill="url(#blueGlow)" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="1">FORMATTER</text>
  <text x="75" y="283" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="500">Fast disk preparation. Protection built in.</text>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="0.8">
